<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="planeHeroTitle">
  <title id="planeHeroTitle">折纸信使「纸飞机」：机翼拖着一条虚线航迹，把索引卡上的原句投递回来</title>
  <defs>
    <linearGradient id="ppWingTop" gradientUnits="userSpaceOnUse" x1="780" y1="180" x2="420" y2="360">
      <stop offset="0" stop-color="#fffdf7" />
      <stop offset="0.55" stop-color="#f2f9f6" />
      <stop offset="1" stop-color="#dcefe9" />
    </linearGradient>
    <linearGradient id="ppWingBottom" gradientUnits="userSpaceOnUse" x1="800" y1="320" x2="400" y2="560">
      <stop offset="0" stop-color="#8fc7bd" />
      <stop offset="0.6" stop-color="#b6dcd4" />
      <stop offset="1" stop-color="#d9ede8" />
    </linearGradient>
    <linearGradient id="ppCard" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="300" y2="210">
      <stop offset="0" stop-color="#fffdf8" />
      <stop offset="1" stop-color="#f8f0de" />
    </linearGradient>
    <filter id="ppDrop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1a2233" flood-opacity="0.13" />
    </filter>
    <filter id="ppCardDrop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1a2233" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- 牵引线：从索引卡右上角连到机翼后缘，略下垂 -->
  <path d="M238 556 C 326 578, 410 512, 458 448" fill="none" stroke="#7a8699" stroke-opacity="0.42"
        stroke-width="3" stroke-linecap="round" stroke-dasharray="11 13" />

  <!-- 航迹起点：一枚暖色小点，作为“投递”的落笔 -->
  <circle cx="238" cy="556" r="4" fill="#d97706" opacity="0.85" />

  <!-- 索引卡：被纸飞机拖着的“引文卡” -->
  <g transform="translate(8,500) rotate(-6) scale(0.8)" filter="url(#ppCardDrop)">
    <path d="M10 0 H246 L282 36 V186 A6 6 0 0 1 276 192 H10 A10 10 0 0 1 0 182 V10 A10 10 0 0 1 10 0 Z"
          fill="url(#ppCard)" stroke="#1a2233" stroke-opacity="0.2" stroke-width="2.6" stroke-linejoin="round" />
    <path d="M246 0 L282 36 H246 Z" fill="#ecdfc4" stroke="#1a2233" stroke-opacity="0.2" stroke-width="2.4" stroke-linejoin="round" />
    <rect x="26" y="44" width="120" height="3" rx="1.5" fill="#0d9488" opacity="0.55" />
    <rect x="26" y="66" width="212" height="9" rx="4.5" fill="#c9d2df" />
    <rect x="26" y="86" width="168" height="9" rx="4.5" fill="#d7dee8" />
    <rect x="26" y="112" width="228" height="36" rx="4" fill="#fbeed6" />
    <rect x="26" y="112" width="5" height="36" rx="2.5" fill="#d97706" />
    <rect x="42" y="125" width="150" height="10" rx="5" fill="#e2b26a" />
    <rect x="26" y="166" width="24" height="3" rx="1.5" fill="#b9c2d4" />
  </g>

  <!-- 纸飞机：N 机头 / T1 上翼尖 / K 龙骨尾（缺口）/ T2 下翼尖 -->
  <g transform="translate(900,150) scale(1.34)" filter="url(#ppDrop)" stroke-linejoin="round">
    <!-- 单一外轮廓，含尾部 V 形缺口 -->
    <path d="M0 0 L-515 70 L-330 225 L-435 395 Z" fill="url(#ppWingTop)"
          stroke="#0f5f57" stroke-opacity="0.62" stroke-width="3" />
    <!-- 下翼（背光面） -->
    <path d="M0 0 L-330 225 L-435 395 Z" fill="url(#ppWingBottom)" />
    <!-- 折脊：机头 → 龙骨尾 -->
    <path d="M0 0 L-330 225" fill="none" stroke="#12564f" stroke-opacity="0.42" stroke-width="2.6" stroke-linecap="round" />
    <!-- 纸褶：上翼一道折痕 -->
    <path d="M0 0 L-425 105" fill="none" stroke="#12665d" stroke-opacity="0.12" stroke-width="1.8" stroke-linecap="round" />
    <!-- 机头信号点 -->
    <circle cx="0" cy="0" r="4.8" fill="#0d9488" />
  </g>

  <!-- 制图刻度：与页面仪器风呼应 -->
  <g stroke="#b9c2d4" stroke-width="2" stroke-linecap="round">
    <path d="M60 140 H96" />
    <path d="M60 122 V158" />
    <path d="M902 656 H946" />
    <path d="M902 638 V674" />
  </g>
</svg>
