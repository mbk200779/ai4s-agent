# AI4S 在线演示网关（Nginx）
#
# 关键设计决策：
# Next.js 的 rewrites 反向代理存在 30 秒硬性超时（实测请求 30.08s 被 ECONNRESET），
# 而写作大纲 / 绘图生成依赖 LLM 推理，实测耗时 40~90 秒，经 rewrites 必然 500。
# 因此在部署层加一层 Nginx：/api/* 直连后端并放宽超时，/* 交给 Next.js。
# 前端仍以相对路径 /api/v1/... 发起请求，应用代码零改动。

server {
    listen 80;
    server_name _;

    # 论文 PDF 上传与导入
    client_max_body_size 100m;

    # ---------- 压缩：隧道链路带宽受限，未压缩的 HTML/JS 会让首屏等很久 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml;

    # ---------- 后端 API：直连 FastAPI ----------
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 生成类接口耗时较长，超时必须放宽，否则评审点击会 504
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 关闭缓冲，避免长响应被整体缓存后才回传
        proxy_buffering off;
    }

    # ---------- 前端页面：交给 Next.js ----------
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 300s;
    }
}
