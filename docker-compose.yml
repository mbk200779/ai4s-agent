# AI4S 学术研究 Agent 第 0 阶段：6 服务全栈骨架
# 关键设计决策：所有服务挂在同一 bridge 网络 ai4s-net 上，使用服务名作为 DNS 地址；
# 对象存储初始化内嵌在 minio 容器启动脚本中，不额外创建一次性服务，保证一键起停后恰好 6 个服务。
services:
  qdrant:
    # 1.11.0 存在 sparse 倒排索引 remove 越界 panic（issue #5231 / PR #5232）：
    # 写入被中断后 InvertedIndexRam 内部错位，此后任何 upsert/delete 都 500
    # "channel closed"，但读仍正常，表现为"能查不能写"。1.12.4 含该修复。
    image: qdrant/qdrant:v1.12.4
    container_name: ai4s-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - ai4s-net
    healthcheck:
      # qdrant 镜像内无 curl，改用 bash 内建 TCP 探测
      test: ["CMD-SHELL", "bash -c ':< /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: ai4s-minio
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
      - ./scripts/init-minio.sh:/init-minio.sh:ro
    networks:
      - ai4s-net
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: ai4s-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai4s-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai4s-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TEMPERATURE: "0"
      PROMPT_VERSION: "v1.0.0"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-ai4s_papers}"
      QDRANT_PAPER_META_COLLECTION: ${QDRANT_PAPER_META_COLLECTION:-ai4s_paper_meta}
      REDIS_URL: "redis://redis:6379/0"
      # 解析进程 RSS 软上限。7168 面向 16GB 机器：实测单篇峰值 ViT(22页/82片段)
      # 6093MB、BERT(16页/58片段) 4512MB，4096 会在 structuring 阶段误杀。
      # 超限只影响单篇内部（worker_max_tasks_per_child=1 已保证每篇独立起步）。
      # 8GB 机器请显式设 4096，见 backend/app/services/ingest/limits.py 的预算说明。
      INGEST_RSS_SOFT_LIMIT_MB: ${INGEST_RSS_SOFT_LIMIT_MB:-7168}
      # 扫描件 OCR：官方测试用例含纯图像 PDF，不开就解析出空文本。
      # 镜像内已装 tesseract（eng + chi_sim），只在无文本层的页上生效。
      INGEST_OCR_ENABLED: ${INGEST_OCR_ENABLED:-true}
      INGEST_OCR_LANG: ${INGEST_OCR_LANG:-eng}
      INGEST_OCR_DPI: ${INGEST_OCR_DPI:-200}
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_PAPERS: ${MINIO_BUCKET_PAPERS:-papers}
      MINIO_BUCKET_FIGURES: ${MINIO_BUCKET_FIGURES:-figures}
      MINIO_BUCKET_PROVENANCE: ${MINIO_BUCKET_PROVENANCE:-provenance}
      MINIO_SECURE: "false"
      LITELLM_MODEL: ${LITELLM_MODEL:-openai/gpt-4o-mini}
      LITELLM_CHEAP_MODEL: ${LITELLM_CHEAP_MODEL:-openai/gpt-4o-mini}
      LITELLM_VISION_MODEL: ${LITELLM_VISION_MODEL:-openai/gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      S2_API_KEY: ${S2_API_KEY:-}
      JUDGE_USERNAME: ${JUDGE_USERNAME:-judge}
      JUDGE_PASSWORD: ${JUDGE_PASSWORD:-ai4s2024}
      # 结构化生成协议（SSE）。关掉 STREAM_ENABLED 后 /qa/stream 直接 503，
      # 前端会退回一次性 /qa/ask —— 出问题时要能一键回到旧链路，而不是回滚镜像。
      STREAM_ENABLED: ${STREAM_ENABLED:-true}
      CLAIM_MIN_EVIDENCE: ${CLAIM_MIN_EVIDENCE:-0.15}
      STREAM_LOG_ENABLED: ${STREAM_LOG_ENABLED:-true}
      STREAM_HEARTBEAT_S: ${STREAM_HEARTBEAT_S:-8}
      # HuggingFace 国内镜像，加速 embedding 模型下载
      HF_ENDPOINT: "https://hf-mirror.com"
      # 禁用 Xet 下载通道（不走镜像站会 401），强制普通 HTTPS 下载
      HF_HUB_DISABLE_XET: "1"
      # 课题级元数据库；api 与 worker 共享同一个文件，靠 WAL 并发写
      DB_PATH: "/app/data/ai4s.db"
      # 长文档解析的工作目录（流式下载的 PDF + 断点状态），必须落在持久卷上
      INGEST_WORK_DIR: "/app/data/ingest"
      # 精排与数值规则召回的开关。改这里 = 一键关掉做 A/B，
      # 也可以只改单个请求（POST /qa/ask 传 "rerank": false）而不动服务端。
      RERANK_ENABLED: ${RERANK_ENABLED:-true}
      RERANK_MODEL: ${RERANK_MODEL:-Xenova/ms-marco-MiniLM-L-6-v2}
      RERANK_TIMEOUT_MS: ${RERANK_TIMEOUT_MS:-1500}
      NUMERIC_RECALL_ENABLED: ${NUMERIC_RECALL_ENABLED:-true}
      RERANK_ALPHA: ${RERANK_ALPHA:-0.2}
      # 嵌入线程数：8 是实测最优（见 config.py 的 embed_threads 注释）
      EMBED_THREADS: ${EMBED_THREADS:-8}
      # 分级置信阈值（07 起替代二值拒答）。改这里即可改分档，不需动代码。
      CONFIDENCE_VERIFIED_SCORE: ${CONFIDENCE_VERIFIED_SCORE:-0.55}
      CONFIDENCE_NEEDS_CHECK_SCORE: ${CONFIDENCE_NEEDS_CHECK_SCORE:-0.15}
      CONFIDENCE_CROSS_PAPER_MIN_SOURCES: ${CONFIDENCE_CROSS_PAPER_MIN_SOURCES:-2}
      # 索引 pipeline 版本：每个版本一个 collection，升级模型/分块必须递增
      PIPELINE_VERSION: ${PIPELINE_VERSION:-v1.0.0}
    networks:
      - ai4s-net
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - model_cache:/app/.cache
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai4s-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker -l info -c 1 -n worker@%h -B
    environment:
      TEMPERATURE: "0"
      PROMPT_VERSION: "v1.0.0"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-ai4s_papers}"
      QDRANT_PAPER_META_COLLECTION: ${QDRANT_PAPER_META_COLLECTION:-ai4s_paper_meta}
      REDIS_URL: "redis://redis:6379/0"
      # 解析进程 RSS 软上限。7168 面向 16GB 机器：实测单篇峰值 ViT(22页/82片段)
      # 6093MB、BERT(16页/58片段) 4512MB，4096 会在 structuring 阶段误杀。
      # 超限只影响单篇内部（worker_max_tasks_per_child=1 已保证每篇独立起步）。
      # 8GB 机器请显式设 4096，见 backend/app/services/ingest/limits.py 的预算说明。
      INGEST_RSS_SOFT_LIMIT_MB: ${INGEST_RSS_SOFT_LIMIT_MB:-7168}
      # 扫描件 OCR：官方测试用例含纯图像 PDF，不开就解析出空文本。
      # 镜像内已装 tesseract（eng + chi_sim），只在无文本层的页上生效。
      INGEST_OCR_ENABLED: ${INGEST_OCR_ENABLED:-true}
      INGEST_OCR_LANG: ${INGEST_OCR_LANG:-eng}
      INGEST_OCR_DPI: ${INGEST_OCR_DPI:-200}
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_PAPERS: ${MINIO_BUCKET_PAPERS:-papers}
      MINIO_BUCKET_FIGURES: ${MINIO_BUCKET_FIGURES:-figures}
      MINIO_BUCKET_PROVENANCE: ${MINIO_BUCKET_PROVENANCE:-provenance}
      MINIO_SECURE: "false"
      LITELLM_MODEL: ${LITELLM_MODEL:-openai/gpt-4o-mini}
      LITELLM_CHEAP_MODEL: ${LITELLM_CHEAP_MODEL:-openai/gpt-4o-mini}
      LITELLM_VISION_MODEL: ${LITELLM_VISION_MODEL:-openai/gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      S2_API_KEY: ${S2_API_KEY:-}
      # HuggingFace 国内镜像，加速 embedding 模型下载
      HF_ENDPOINT: "https://hf-mirror.com"
      # 禁用 Xet 下载通道（不走镜像站会 401），强制普通 HTTPS 下载
      HF_HUB_DISABLE_XET: "1"
      # 课题级元数据库；api 与 worker 共享同一个文件，靠 WAL 并发写
      DB_PATH: "/app/data/ai4s.db"
      # 长文档解析的工作目录（流式下载的 PDF + 断点状态），必须落在持久卷上
      INGEST_WORK_DIR: "/app/data/ingest"
      # 以下与 api 保持一致：worker 里也会跑嵌入、精排与综述分句，
      # 两处口径不同会出现"入库时按 8 线程、问答时按默认线程"这类难查的差异。
      RERANK_ENABLED: ${RERANK_ENABLED:-true}
      RERANK_MODEL: ${RERANK_MODEL:-Xenova/ms-marco-MiniLM-L-6-v2}
      RERANK_TIMEOUT_MS: ${RERANK_TIMEOUT_MS:-1500}
      RERANK_ALPHA: ${RERANK_ALPHA:-0.2}
      NUMERIC_RECALL_ENABLED: ${NUMERIC_RECALL_ENABLED:-true}
      EMBED_THREADS: ${EMBED_THREADS:-8}
      CONFIDENCE_VERIFIED_SCORE: ${CONFIDENCE_VERIFIED_SCORE:-0.55}
      CONFIDENCE_NEEDS_CHECK_SCORE: ${CONFIDENCE_NEEDS_CHECK_SCORE:-0.15}
      CONFIDENCE_CROSS_PAPER_MIN_SOURCES: ${CONFIDENCE_CROSS_PAPER_MIN_SOURCES:-2}
      PIPELINE_VERSION: ${PIPELINE_VERSION:-v1.0.0}
    networks:
      - ai4s-net
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - model_cache:/app/.cache
      - app_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping --timeout 5 || exit 1"]
      # celery inspect 自身要 5s，加上解释器启动接近 10s，原先 timeout: 10s 会被判超时
      interval: 30s
      timeout: 25s
      retries: 8
      start_period: 120s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: ai4s-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      # Next.js standalone 默认绑定 $HOSTNAME（容器内即容器 ID），
      # 只监听容器 IP 而不绑 0.0.0.0，导致 localhost:3000 探不通、
      # 健康检查永远 unhealthy（外部经 web:3000 访问却是正常的）。
      HOSTNAME: "0.0.0.0"
    networks:
      - ai4s-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # 公网入口的第一跳：Nginx 网关。
  # 之所以单独一层，是因为 Next.js 的 rewrites 有 30 秒硬性超时，
  # 而 LLM 生成类接口要 40~90 秒；/api/* 由这里直连 FastAPI 并放宽到 300s。
  gateway:
    image: nginx:alpine
    container_name: ai4s-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ai4s-net
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  # Cloudflare 命名隧道：把 demo.mabokai.site 的出站连接接到网关上。
  # token 放在 .env 的 CLOUDFLARE_TUNNEL_TOKEN（.env 已被 gitignore）。
  # 因为挂在 profile 下，平时 `docker compose up -d` 不会动它，
  # 需要隧道时用 `docker compose --profile tunnel up -d` 或直接跑 deploy/start-all.sh。
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ai4s-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    # --protocol http2：强制走 TCP 443。默认的 QUIC(UDP) 在国内部分运营商线路上
    # 会被限速/丢包，表现为网页首字节 2s~60s 剧烈抖动、加载卡死。
    # TUNNEL_EDGE_IP_VERSION=4：本机没有可用 IPv6，cloudflared 默认 auto 会先试
    # IPv6 边缘地址再回退，实测白等数秒。
    command: tunnel --no-autoupdate run --protocol http2 --token ${CLOUDFLARE_TUNNEL_TOKEN:?请先在 .env 中设置 CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      TUNNEL_EDGE_IP_VERSION: "4"
    networks:
      - ai4s-net
    depends_on:
      gateway:
        condition: service_started

  # 国内隧道（cpolar）：Cloudflare 隧道在国际出口拥塞时（实测晚高峰回源丢包
  # 60~75%，连 231 字节的图标都传不完）的替代入口。cpolar 走国内节点，
  # 不受国际出口影响。
  #
  # 同样是 profile，不影响 `docker compose up -d`：
  #   docker compose --profile cpolar up -d cpolar
  # 前提是 .env 里有 CPOLAR_AUTHTOKEN（https://dashboard.cpolar.com/auth 复制）。
  #
  # 配置模板在 deploy/cpolar.yml，token 用 __CPOLAR_TOKEN__ 占位，
  # 启动时 sed 替换到 /tmp 再加载 —— 明文 token 不进 git。
  cpolar:
    image: probezy/cpolar:latest
    container_name: ai4s-cpolar
    restart: unless-stopped
    profiles: ["cpolar"]
    environment:
      # 用 `:-` 而不是 `:?`：`${VAR:?}` 在变量缺失时会让**所有** compose 命令
      # 直接失败（连 `docker compose ps` 都跑不了），即使这个服务没被启用。
      CPOLAR_AUTHTOKEN: ${CPOLAR_AUTHTOKEN:-}
    volumes:
      - ./deploy/cpolar.yml:/opt/cpolar.yml:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ -z "$$CPOLAR_AUTHTOKEN" ]; then
          echo "CPOLAR_AUTHTOKEN 为空，cpolar 不建隧道。在 .env 填入后 docker compose restart cpolar。" >&2
          # 不用 exit 0：restart: unless-stopped 下退出会被反复拉起，日志刷屏。
          # 挂住进程，容器保持 running，配好 token 重启即可。
          exec tail -f /dev/null
        fi
        sed "s|__CPOLAR_TOKEN__|$${CPOLAR_AUTHTOKEN}|" /opt/cpolar.yml > /tmp/cpolar.yml
        exec cpolar start-all -dashboard=on -daemon=on -config=/tmp/cpolar.yml -log=stdout
    networks:
      - ai4s-net
    depends_on:
      gateway:
        condition: service_started

networks:
  ai4s-net:
    driver: bridge

volumes:
  qdrant_storage:
  minio_data:
  redis_data:
  model_cache:
  # 课题级元数据库（SQLite 单文件），api 与 worker 共享
  app_data:
